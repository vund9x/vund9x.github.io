<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="title">Bộ Tạo Số Ngẫu Nhiên & Thống Kê</title>
  <link rel="icon" href="./favicon.ico">
  <!-- Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/random.css">
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <div class="container">
    <main class="card">
      <!-- Header & Language Switcher -->
      <header class="header">
        <h1 data-key="header_title">Mô Phỏng & Thống Kê Số Ngẫu Nhiên</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="lang-switcher">
            <button class="lang-btn active" data-lang="vi" onclick="setLanguage('vi')">VI</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
          </div>
          <button id="theme-toggle" type="button" class="theme-toggle-btn" title="Chuyển đổi giao diện">
            <!-- Sun Icon (shown in dark theme) -->
            <svg id="theme-toggle-sun" class="theme-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon Icon (shown in light theme) -->
            <svg id="theme-toggle-moon" class="theme-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Validation Error Alert Banner -->
      <div id="validation-alert" class="validation-alert"></div>

      <!-- Presets Selector -->
      <section class="presets-group">
        <label data-key="presets_label">Cấu hình mẫu nhanh (Presets)</label>
        <div class="presets-container" id="presets-container">
          <button class="preset-btn" onclick="applyPreset(0, 100, 1, 1, true, this)" data-key="preset_default">Mặc định
            (0-100, lấy 1)</button>
          <button class="preset-btn" onclick="applyPreset(0, 100, 6, 20, true, this)" data-key="preset_example">Ví dụ
            (0-100, lấy 6, 20 vòng)</button>
          <button class="preset-btn" onclick="applyPreset(1, 6, 1, 1, false, this)" data-key="preset_dice">Xúc xắc
            (1-6)</button>
          <button class="preset-btn" onclick="applyPreset(0, 1, 1, 1, false, this)" data-key="preset_coin">Tung đồng xu
            (0-1)</button>
        </div>
      </section>

      <!-- Main Config Form -->
      <section class="config-section">
        <div class="form-group">
          <label for="min-val" data-key="label_min">Giá trị nhỏ nhất (Min)</label>
          <input type="number" id="min-val" value="0" oninput="clearPresetActive()">
        </div>
        <div class="form-group">
          <label for="max-val" data-key="label_max">Giá trị lớn nhất (Max)</label>
          <input type="number" id="max-val" value="100" oninput="clearPresetActive()">
        </div>
        <div class="form-group">
          <label for="draw-count" data-key="label_count">Số lượng số cần lấy mỗi lượt</label>
          <input type="number" id="draw-count" value="1" min="1" oninput="clearPresetActive()">
        </div>
        <div class="form-group">
          <label for="loop-count" data-key="label_loops">Số vòng lặp (Số lượt quay thử)</label>
          <input type="number" id="loop-count" value="1" min="1" oninput="clearPresetActive()">
        </div>
      </section>

      <section class="form-group" style="margin-bottom: 24px;">
        <label class="checkbox-container">
          <input type="checkbox" id="unique-draw" checked onchange="clearPresetActive()">
          <span class="checkmark"></span>
          <span data-key="label_unique">Không trùng số trong cùng một lượt quay</span>
        </label>
      </section>

      <!-- Speed Control Group -->
      <section class="sim-controls-group">
        <label data-key="label_speed">Tốc độ mô phỏng vòng lặp</label>
        <div class="sim-speed-selector">
          <button class="speed-btn" data-speed="slow" onclick="setSpeed('slow')"><span
              data-key="speed_slow">Chậm</span></button>
          <button class="speed-btn active" data-speed="medium" onclick="setSpeed('medium')"><span
              data-key="speed_medium">Vừa</span></button>
          <button class="speed-btn" data-speed="fast" onclick="setSpeed('fast')"><span
              data-key="speed_fast">Nhanh</span></button>
          <button class="speed-btn" data-speed="instant" onclick="setSpeed('instant')"><span
              data-key="speed_instant">Tức thì</span></button>
        </div>
      </section>

      <!-- Submit Action Button -->
      <button id="start-btn" class="action-btn" onclick="startSimulation()">
        <span class="loader-spinner" id="btn-spinner"></span>
        <span id="btn-text" data-key="btn_start">Quay Số Ngay</span>
      </button>

      <!-- Live simulation status -->
      <div id="status-area" class="status-area">
        <p id="status-text"></p>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Result displays -->
      <section id="results-section" class="results-section">
        <div style="text-align: center; margin-bottom: 8px;">
          <h2 data-key="result_heading" style="font-family: 'Outfit', sans-serif;">Kết Quả May Mắn</h2>
          <p id="result-meta-desc" class="text-accent mt-4"></p>
        </div>

        <!-- Lottery balls container -->
        <div id="balls-container" class="balls-display"></div>

        <!-- Detailed Statistics and History panel -->
        <div class="details-grid">
          <!-- Frequency Chart Panel -->
          <div class="details-panel">
            <h3>
              <span data-key="panel_freq_title">Bảng Tần Suất Xuất Hiện</span>
              <span class="stat-desc" id="stat-range-desc"></span>
            </h3>
            <div id="chart-container" class="chart-container">
              <!-- Dynamic bars will be inserted here -->
            </div>
          </div>

          <!-- History Logs Panel -->
          <div class="details-panel">
            <h3>
              <span data-key="panel_history_title">Nhật Ký Vòng Quay</span>
              <span class="stat-desc" id="history-count-desc"></span>
            </h3>
            <div id="history-container" class="history-container">
              <!-- Dynamic history logs will be inserted here -->
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p data-key="footer_text">Phát triển bởi <a href="./index.html">vund9x</a> &copy; 2026. Công cụ tạo số ngẫu nhiên
        tối ưu.</p>
    </footer>
  </div>

  <script src="./js/random.js"></script>
  <script>
    (function() {
      const themeToggle = document.getElementById('theme-toggle');
      const sunIcon = document.getElementById('theme-toggle-sun');
      const moonIcon = document.getElementById('theme-toggle-moon');
      
      function updateToggleUI(theme) {
        if (theme === 'light') {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        } else {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        }
      }
      
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      updateToggleUI(currentTheme);
      
      themeToggle.addEventListener('click', () => {
        const activeTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = activeTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateToggleUI(newTheme);
      });
    })();
  </script>
</body>

</html>
